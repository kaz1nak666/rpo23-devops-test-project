name: Continuous Deployment

on:
  push:
    branches: [main] 

jobs:
  deploy:
    runs-on: self-hosted 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Environment File
        run: |
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" > .env
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env
          echo "JWT_ISSUER=${{ secrets.JWT_ISSUER }}" >> .env
          echo "JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}" >> .env
          echo "JWT_EXPIRATION_MINUTES=${{ secrets.JWT_EXPIRATION_MINUTES }}" >> .env
          echo "✅ .env файл создан для деплоя"

      - name: Deploy application
        run: |
          echo "🔄 Останавливаем старые контейнеры..."
          docker compose down
          
          echo "🔄 Собираем новый образ .NET..."
          docker compose build
          
          echo "🚀 Запускаем приложение..."
          docker compose up -d
          
          echo "✅ Деплой завершён!"

      - name: Verify deployment
        run: |
          echo "⏳ Ждём 15 секунд для запуска..."
          Start-Sleep -Seconds 15
          
          echo "🔍 Проверяем контейнеры..."
          docker compose ps
          
          echo "🌐 Проверяем ответ от API..."
          curl -f http://localhost:8080/health || echo "⚠️ Health check не ответил (возможно, нет такого эндпоинта)"