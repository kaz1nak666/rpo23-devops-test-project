name: Continuous Deployment

on:
  push:
    branches: [main]  

jobs:
  deploy:
    runs-on: self-hosted  
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Run Docker Compose
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_EXPIRATION_MINUTES: ${{ secrets.JWT_EXPIRATION_MINUTES }}
        run: |
          echo "🔄 Останавливаем старые контейнеры..."
          docker compose down
          
          echo "🔄 Собираем новый образ .NET..."
          docker compose build
          
          echo "🚀 Запускаем приложение..."
          docker compose up -d
          
          echo "✅ Деплой завершён!"

      - name: Verify deployment
        run: |
          echo "⏳ Ждём 15 секунд для запуска..."
          Start-Sleep -Seconds 15
          
          echo "🔍 Проверяем контейнеры..."
          docker compose ps
          
          echo "🌐 Проверяем ответ от API..."
          curl -f http://localhost:8080/health || echo "⚠️ Health check не ответил"